<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrinho | Sport Kicks</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/carrinho.css">
</head>
<body class="cart-body">

  <!-- ══════════ NAVBAR ══════════ -->
  <nav class="navbar scrolled" id="navbar">
    <div class="navbar-inner">
      <a href="../index.html" class="navbar-logo">SPORT<span>KICKS</span></a>
      <div class="navbar-menu" id="navMenu">
        <a href="../index.html" class="navbar-link">Início</a>
        <a href="catalogo.html" class="navbar-link">Catálogo</a>
      </div>
      <div class="navbar-actions">
        <a href="login.html" class="btn btn-ghost btn-sm">Entrar</a>
        <a href="carrinho.html" class="cart-btn" aria-label="Carrinho">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-badge" id="cartBadge" style="display:none">0</span>
        </a>
        <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ══════════ TOAST CONTAINER ══════════ -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ══════════ MAIN CONTENT ══════════ -->
  <main class="cart-page">
    <div class="cart-container">
      <h1 class="cart-title">Seu Carrinho</h1>
      
      <div class="cart-layout">
        <!-- Lista de Itens -->
        <div class="cart-items" id="cartItemsContainer">
          <!-- Renderizado via JS -->
          <div class="empty-cart" id="emptyCartMessage" style="display: none;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <p>Seu carrinho está vazio.</p>
            <a href="catalogo.html" class="btn btn-primary">Ver Produtos</a>
          </div>
        </div>

        <!-- Resumo do Pedido -->
        <div class="cart-summary" id="cartSummary">
          <h3>Resumo</h3>
          
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="summarySubtotal">R$ 0,00</span>
          </div>
          
          <div class="summary-row" id="summaryDiscountRow" style="display:none;">
            <span>Desconto (3+ itens)</span>
            <span id="summaryDiscount" class="text-accent">- R$ 0,00</span>
          </div>
          
          <div class="summary-row">
            <span>Frete</span>
            <span id="summaryFreight">R$ 0,00</span>
          </div>
          
          <hr class="summary-divider">
          
          <div class="summary-row total">
            <span>Total</span>
            <span id="summaryTotal">R$ 0,00</span>
          </div>
          
          <div class="form-group" style="margin-top: 1.5rem;">
            <label for="formaPagamento">Forma de Pagamento</label>
            <select id="formaPagamento" class="form-control">
              <option value="CARTAO_CREDITO">Cartão de Crédito</option>
              <option value="CARTAO_DEBITO">Cartão de Débito</option>
              <option value="PIX">PIX</option>
              <option value="BOLETO">Boleto Bancário</option>
            </select>
          </div>
          
          <button class="btn btn-primary btn-full checkout-btn" id="btnFinalizar" onclick="finalizarCompra()">
            Finalizar Compra
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ══════════ FOOTER ══════════ -->
  <footer class="cart-footer container">
    <a href="../index.html" class="navbar-logo">SPORT<span>KICKS</span></a>
    <p>Encontre o tênis que acompanha a sua corrida.</p>
    <a href="ajuda.html">Manual e ajuda</a>
  </footer>

  <!-- ══════════ SCRIPTS ══════════ -->
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/carrinho.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // O carrinho.js gerencia a renderização
      renderizarCarrinhoNaPagina()
    })
  </script>
</body>
</html>
